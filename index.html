<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Snake Game">
<meta property="og:description" content="Collect food, grow your snake, and avoid hitting the walls or your tail.">
<meta property="og:url" content="https://mjv1981-art.github.io/snake-game-simple/">
<meta property="og:image" content="https://mjv1981-art.github.io/App-Portal/assets/covers/snake-game.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="450">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            flex-direction: column;
            margin: 0;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        #game-container {
            border: 5px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            background-color: #222;
        }
        canvas {
            display: block;
        }
        #controls {
            margin-top: 20px;
            text-align: center;
        }
        #restart-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        #restart-button:hover {
            background-color: #45a049;
        }
        #score {
            font-size: 24px;
            margin-top: 10px;
        }
    </style>
    <style>
:root {
      /* ZX-ish palette for border stripes */
      --zx0: #000000;
      --zx1: #0000d7; /* blue */
      --zx2: #d70000; /* red */
      --zx3: #d7d700; /* yellow */
      --zx4: #00d700; /* green */
      --zx5: #00d7d7; /* cyan */
      --zx6: #d700d7; /* magenta */
      --zx7: #d7d7d7; /* white-ish */
    }
    /* ===== Retro splash with ZX border stripes ===== */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      cursor: pointer;
      display: grid;
      place-items: center;

      /* big Spectrum-like border area */
      padding: clamp(42px, 10vmin, 140px);

      /* striped border (tape-loader vibe) */
      background:
        repeating-linear-gradient(
          0deg,
          var(--zx2) 0px, var(--zx2) 6px,
          var(--zx3) 6px, var(--zx3) 12px,
          var(--zx4) 12px, var(--zx4) 18px,
          var(--zx5) 18px, var(--zx5) 24px,
          var(--zx1) 24px, var(--zx1) 30px,
          var(--zx6) 30px, var(--zx6) 36px,
          var(--zx7) 36px, var(--zx7) 42px,
          var(--zx0) 42px, var(--zx0) 50px
        );
      background-size: 100% 120px;
      animation: zxBorder 0.22s linear infinite;
      box-sizing: border-box;
    }

    @keyframes zxBorder {
      0% { background-position: 0 0; }
      100% { background-position: 0 120px; }
    }

    /* inner "screen" */
    .splash-inner {
      width: min(860px, 100%);
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 0 60px rgba(0,0,0,.55);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;

      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .brand {
      font-size: clamp(26px, 5vw, 56px);
      font-weight: 900;
      color: #ff0;
      text-shadow: 2px 2px 0 #f0f, 4px 4px 0 #0ff;
      letter-spacing: 6px;
      animation: flicker 2s infinite;
      user-select: none;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      50% { opacity: 0.82; }
      100% { opacity: 1; }
    }

    .loader-text {
      font-size: clamp(16px, 3.6vw, 34px);
      color: #0f0;
      border-right: 2px solid #0f0;
      white-space: nowrap;
      overflow: hidden;
      padding-right: 6px;
      animation: blink-cursor 1s step-end infinite;
      user-select: none;
    }

    @keyframes blink-cursor {
      from, to { border-color: transparent; }
      50% { border-color: #0f0; }
    }

    .tape-bars {
      width: min(720px, 86%);
      height: 32px;
      background: repeating-linear-gradient(
        90deg,
        #0f0 0px,
        #0f0 10px,
        #000 10px,
        #000 20px
      );
      background-size: 200% 100%;
      animation: move-bars 0.5s linear infinite;
      opacity: 0.75;
      border: 1px solid rgba(0,255,0,.35);
      box-shadow: 0 0 18px rgba(0,255,0,.15);
    }

    @keyframes move-bars {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }

    .click-hint {
      margin-top: 10px;
      font-size: clamp(12px, 2.6vw, 22px);
      color: rgba(255,255,255,.35);
      animation: pulse 1.5s infinite;
      user-select: none;
    }

    @keyframes pulse {
      0% { opacity: 0.25; }
      50% { opacity: 1; }
      100% { opacity: 0.25; }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      #splash-screen { animation: none; }
      .tape-bars { animation: none; }
      .brand { animation: none; }
      .loader-text { animation: none; }
      .click-hint { animation: none; }
    }
@media(max-width:370px){#splash-screen .splash-inner{gap:10px}#splash-screen .brand{font-size:22px}}
#splash-screen{background-size:auto 50px;animation-name:copy-tape-stripes;color:#fff}
@keyframes copy-tape-stripes{to{background-position:0 50px}}

@media(prefers-reduced-motion:reduce){#splash-screen{animation:none}}
#splash-screen[hidden]{display:none}
@media (orientation:landscape) and (max-height:520px){
  #splash-screen{padding:14px}
  #splash-screen .splash-inner{width:min(860px,100%,calc((100dvh - 30px) * 4 / 3));gap:10px}
}
#snake-game { display:flex; flex-direction:column; align-items:center }
#splash-screen:focus-visible { outline:2px dashed white; outline-offset:-6px }
    </style>
</head>
<body>
<div id="splash-screen" role="button" aria-label="Retro Waves splash. Tap to start." tabindex="0">
    <div class="splash-inner">
      <div class="brand">RETRO WAVE</div>
      <div class="loader-text" id="loading-text">LOADING...</div>
      <div class="tape-bars"></div>
      <div class="click-hint">> TAP / CLICK TO START TAPE <</div>
    </div>
  </div>
    <main id="snake-game" inert>
    <h1>Classic Snake</h1>
    <div id="game-container">
        <canvas id="gameCanvas" tabindex="-1" aria-label="Snake game board" width="400" height="400"></canvas>
    </div>
    <div id="controls">
        <p id="score">Score: 0</p>
        <button id="restart-button">Restart Game</button>
    </div>
    </main>

    <script>
        // --- Game Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const restartButton = document.getElementById('restart-button');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{ x: 10, y: 10 }];
        let food = {};
        let score = 0;
        let dx = 0;
        let dy = 0;
        let changingDirection = false;
        let gameLoopId;
        let gameOver = false;

        // --- Game Functions ---
        
        // Main game loop
        function main() {
            if (gameOver) {
                return;
            }
            
            changingDirection = false;
            
            // Wait for the next frame
            gameLoopId = setTimeout(() => {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                
                // Check for game over conditions
                if (checkCollision()) {
                    showGameOver();
                    return;
                }

                // If snake eats food
                if (snake[0].x === food.x && snake[0].y === food.y) {
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                    generateFood();
                } else {
                    // Remove the tail if no food was eaten
                    snake.pop();
                }

                // Call the main loop again
                main();
            }, 100); // Game speed
        }

        // Clears the canvas
        function clearCanvas() {
            ctx.fillStyle = '#222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draws the snake on the canvas
        function drawSnake() {
            snake.forEach(drawSnakeSegment);
        }

        // Draws a single segment of the snake
        function drawSnakeSegment(segment) {
            ctx.fillStyle = '#4CAF50';
            ctx.strokeStyle = '#222';
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
        }

        // Draws the food
        function drawFood() {
            ctx.fillStyle = '#FF5252';
            ctx.strokeStyle = '#222';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            ctx.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // Generates food at a random position
        function generateFood() {
            const foodX = Math.floor(Math.random() * tileCount);
            const foodY = Math.floor(Math.random() * tileCount);
            food = { x: foodX, y: foodY };
            
            // Ensure food doesn't spawn on the snake
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === food.x && snake[i].y === food.y) {
                    generateFood();
                }
            }
        }

        // Moves the snake
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Add new head to the beginning
        }

        // Checks for collisions with walls or the snake's own body
        function checkCollision() {
            const head = snake[0];
            
            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // Self-collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }
        
        // Show game over message
        function showGameOver() {
            gameOver = true;
            clearCanvas();
            ctx.fillStyle = 'white';
            ctx.font = '30px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
        }

        // --- Event Listeners ---
        // Changes the snake's direction based on keyboard input
        function changeDirection(event) {
            const keyPressed = event.key;
            if (changingDirection || gameOver) {
                return;
            }
            changingDirection = true;
            
            switch (keyPressed) {
                case 'ArrowLeft':
                case 'a':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowUp':
                case 'w':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowRight':
                case 'd':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
                case 'ArrowDown':
                case 's':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
            }
        }

        // --- Game Initialization ---
        function startGame() {
            clearTimeout(gameLoopId);
            snake = [{ x: 10, y: 10 }];
            score = 0;
            scoreDisplay.textContent = `Score: 0`;
            dx = 1;
            dy = 0;
            gameOver = false;
            generateFood();
            main();
        }

        const splash = document.getElementById('splash-screen');
        const loadingText = document.getElementById('loading-text');
        const game = document.getElementById('snake-game');
        const tapeDuration = 3600;
        let tapeStarted = false;

        function playTapeSound() {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const audio = new AudioContext();
          if (audio.state === 'suspended') audio.resume().catch(() => {});
          const gain = audio.createGain();
          gain.gain.value = .1425;

          const duration = tapeDuration / 1000;
          const sampleRate = audio.sampleRate;
          const buffer = audio.createBuffer(1, sampleRate * duration, sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < buffer.length; i++) {
            const t = i / sampleRate;
            let sample = 0;

            if (t < 0.5) {
              sample = Math.random() * 0.28 - 0.14;
            } else if (t < 1.5) {
              sample = Math.sin(2 * Math.PI * 2000 * t) * 0.35 + (Math.random() * 0.1 - 0.05);
            } else if (t < 2.6) {
              const freq = (Math.sin(2 * Math.PI * 18 * t) > 0) ? 1500 : 2500;
              sample = Math.sin(2 * Math.PI * freq * t) * 0.36 + (Math.random() * 0.18 - 0.09);
            } else {
              const decay = 1 - (t - 2.6) / 1.0;
              sample = Math.sin(2 * Math.PI * 1600 * t) * 0.22 * decay;
            }

            sample += (Math.random() * 0.08 - 0.04) * (1 - t / duration);
            data[i] = Math.max(-1, Math.min(1, sample));
          }

          const source = audio.createBufferSource();
          source.buffer = buffer;
          source.connect(gain);
          gain.connect(audio.destination);
          source.start();

          source.onended = () => {
            source.disconnect();
            gain.disconnect();
            audio.close().catch(() => {});
          };
        }

        function startSplashSequence() {
          if (tapeStarted) return;
          tapeStarted = true;
          loadingText.textContent = '> TAPE LOADING... <';
          try { playTapeSound(); } catch { /* Play continues when audio is unavailable. */ }

          let dots = 0;
          const ticker = setInterval(() => {
            dots = (dots + 1) % 4;
            loadingText.textContent = '> TAPE LOADING' + '.'.repeat(dots) + ' <';
          }, 300);

          setTimeout(() => {
            clearInterval(ticker);
            splash.hidden = true;
            game.inert = false;
            document.addEventListener('keydown', changeDirection);
            restartButton.addEventListener('click', startGame);
            canvas.focus({preventScroll:true});
            startGame();
          }, tapeDuration);
        }

        splash.addEventListener('click', startSplashSequence);
        splash.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            startSplashSequence();
          }
        });
    </script>
</body>
</html>
